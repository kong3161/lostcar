<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>แผนที่จุดรถหาย</title>
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #b31217, #6a0572);
      color: white;
    }
    #map {
      height: 60vh;
      width: 100%;
    }
    h2 {
      text-align: center;
      padding: 1rem;
    }
    .btn-group {
      text-align: center;
      margin: 1rem 0;
    }
    .btn {
      background: white;
      color: black;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      margin: 5px;
      display: inline-block;
    }
    .search-form {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 2rem 0;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 160px;
    }

    .input-group label {
      margin-bottom: 6px;
      font-weight: bold;
    }

    .input-group input[type="date"] {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      background: #fff;
      color: #000;
    }

    .search-button {
      padding: 10px 16px;
      font-size: 1rem;
      background-color: white;
      color: black;
      border: none;
      border-radius: 6px;
      min-width: 160px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .search-button:hover {
      background-color: #dddddd;
    }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: center; margin-top: 1rem;">
    <div style="padding: 0.5rem 1.2rem; background: linear-gradient(to right, #1e3c72, #6a0572); color: white; border-radius: 10px;">
      <h2 style="margin: 0;">แผนที่แสดงจุดรถหาย</h2>
    </div>
  </div>
  <p style="text-align: center; margin-top: 0.75rem; color: #ffeb3b; font-weight: bold;">
    ⚠️ กรณีหายสถานที่เดียวกัน หมุดจะมีแค่อันเดียวเท่านั้น <br>
    (หมุดสีเขียว = ได้คืนแล้ว / หมุดสีแดง = ยังหายอยู่)
  </p>
  <form method="get" action="/map" class="search-form">
    <div class="input-group">
      <label for="from_date">จากวันที่:</label>
      <input type="date" name="from_date" id="from_date" required>
    </div>
    <div class="input-group">
      <label for="to_date">ถึงวันที่:</label>
      <input type="date" name="to_date" id="to_date" required>
    </div>
    <button type="submit" class="search-button">🔍 ดูแผนที่ช่วงวัน</button>
  </form>
  <div id="map"></div>
  <div style="display: flex; justify-content: center; gap: 1rem; margin: 1rem;">
    <button onclick="toggleHeatmap()">🔥 เปิด/ปิด Heatmap</button>
    <button onclick="toggleMarkers()">📍 เปิด/ปิดหมุด</button>
  </div>
  <div class="btn-group">
    <a class="btn" href="/submit">📋 แจ้งรถหาย</a>
    <a class="btn" href="/search">🔍 ค้นหา</a>
    <a class="btn" href="/">🔙️ กลับหน้าแรก</a>
    <a class="btn" href="/dashboard">📊 แดชบอร์ด</a>
    <a class="btn" href="/report">📄 พิมพ์รายงาน Excel</a>
    <a class="btn" href="/map" style="background: #ddd; font-weight: bold;">🗺️ แผนที่</a>
  </div>

  <script>
    let heatmap = null;
    let markersVisible = true;

    function toggleHeatmap() {
      if (!heatmap) {
        const heatmapData = [];

        for (const key in markersMap) {
          const [lat, lng] = key.split(',').map(Number);
          heatmapData.push(new google.maps.LatLng(lat, lng));
        }

        heatmap = new google.maps.visualization.HeatmapLayer({
          data: heatmapData,
          radius: 30
        });
        heatmap.setMap(map);
      } else {
        if (heatmap.getMap()) {
          heatmap.setMap(null);
        } else {
          heatmap.setMap(map);
        }
      }
    }

    function toggleMarkers() {
      markersVisible = !markersVisible;
      for (const marker of allMarkers) {
        marker.setMap(markersVisible ? map : null);
      }
    }

    function initMap() {
      window.map = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: { lat: 13.987004, lng: 100.614520 },
      });

      const polygon = new google.maps.Polygon({
        paths: [
          { lat: 13.9956256, lng: 100.6016595 },
          { lat: 13.9659496, lng: 100.6054065 },
          { lat: 13.9794617, lng: 100.6632403 },
          { lat: 14.0096853, lng: 100.6637291 },
          { lat: 13.9956256, lng: 100.6016595 }
        ],
        strokeColor: "#FF5722",
        strokeOpacity: 0.8,
        strokeWeight: 2,
        fillColor: "#FF5722",
        fillOpacity: 0.15,
        zIndex: 0
      });

      polygon.setMap(map);

      const reports = {{ reports | tojson }};
      console.log("Reports loaded:", reports);

      // Group reports by lat/lng key
      window.markersMap = {};
      window.allMarkers = [];

      for (const item of reports) {
        const lat = parseFloat(item.lat);
        const lng = parseFloat(item.lng);
        const key = `${lat.toFixed(6)},${lng.toFixed(6)}`;

        if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
          if (!markersMap[key]) {
            markersMap[key] = [];
          }
          markersMap[key].push(item);
        }
      }

      // Create one marker per unique location with combined info
      for (const key in markersMap) {
        const [lat, lng] = key.split(',').map(Number);
        const itemsAtLocation = markersMap[key];

        // --- แก้ไข Logic เลือกสีหมุดตรงนี้ ---
        // เช็คว่ารถทุกคันในจุดนี้ได้คืนหมดหรือยัง?
        // (ถ้ามีคันใดคันหนึ่งยังไม่ได้คืน ให้ถือว่าเป็นจุดที่ต้องเฝ้าระวัง -> สีแดง)
        // แต่ถ้าทุกคันในจุดนี้ is_recovered = true หมด -> สีเขียว
        const allRecovered = itemsAtLocation.every(item => item.is_recovered === true);

        let iconUrl = "/static/P2.png"; // สีแดง/โลโก้เดิม

        if (allRecovered) {
             // ใช้หมุดสีเขียวรูป P1.png จากโฟลเดอร์ static
             iconUrl = "/static/P1.png";
        }

        const marker = new google.maps.Marker({
          position: { lat, lng },
          map,
          icon: {
            url: iconUrl,
            // ปรับขนาดและ anchor สำหรับ P1.png
            scaledSize: allRecovered ? new google.maps.Size(47, 47) : new google.maps.Size(47, 47),
            anchor: allRecovered ? new google.maps.Point(23.5, 47) : new google.maps.Point(23.5, 47)
          }
        });

        allMarkers.push(marker);

        let infoContent = '<div style="color:black; font-size: 1.05rem; font-weight: bold;">';
        for (const item of itemsAtLocation) {
          // เพิ่มข้อความ (คืนแล้ว) ใน Popup ด้วยจะได้ชัดเจน
          const statusText = item.is_recovered ? '<span style="color:green;">(คืนแล้ว)</span>' : '<span style="color:red;">(ยังไม่คืน)</span>';
          
          infoContent += `
            <hr>
            <strong>สถานะ:</strong> ${statusText}<br>
            <strong>ประเภทรถ:</strong> ${item.vehicle_type || '-'}<br>
            <strong>ยี่ห้อ:</strong> ${item.brand || '-'}<br>
            <strong>รุ่น:</strong> ${item.model || '-'}<br>
            <strong>สี:</strong> ${item.color || '-'}<br>
            <strong>วันที่หาย:</strong> ${item.date_lost || '-'}<br>
            <strong>เขตตรวจ:</strong> ${item.zone || '-'}<br>
          `;
        }
        infoContent += '</div>';

        const infoWindow = new google.maps.InfoWindow({
          content: infoContent
        });

        marker.addListener("click", () => {
          infoWindow.open(map, marker);
        });
      }
    }
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=initMap&libraries=visualization">
  </script>
</body>
</html>
